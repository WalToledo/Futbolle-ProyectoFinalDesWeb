<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
    <title>Futbolle - Contact</title>
</head>
<body>
    <header class="main-header">
        <h1 class="game-title"><img src="img/logo.png" alt="Futbolle" class="game-logo"></h1>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Back to Game</a>
            <button id="theme-toggle-btn" class="btn theme-toggle-btn">Light Mode</button>
        </nav>
    </header>

    <main class="game-container">
        <section class="contact-section">
            <h2 class="section-title"><img src="img/contact-us.png" alt="Contact Us" class="contact-logo"></h2>
            <form id="contact-form" class="contact-form">

                <div class="form-group">
                    <label for="contact-name" class="form-label">Name:</label>
                    <input type="text" id="contact-name" class="search-input" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="contact-email" class="form-label">Email:</label>
                    <input type="text" id="contact-email" class="search-input" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="contact-message" class="form-label">Message:</label>
                    <textarea id="contact-message" class="search-input textarea-input"></textarea>
                </div>

                <button type="submit" id="btn-send-email" class="btn btn-primary">Send Email</button>
                <p id="contact-feedback" class="contact-feedback hidden"></p>
            </form>

            <div class="github-container">
                <a href="https://github.com/WalToledo/Futbolle-ProyectoFinalDesWeb" target="_blank" class="nav-link github-link">Github Repository</a>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p class="footer-text">Futbolle &copy; Walter Toledo - 2026 - UAI</p>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
