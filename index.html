<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbolle - Football Guessing Game</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="main-header">
        <h1 class="game-title">Futbolle</h1>
        <nav class="main-nav">
            <a href="contact.html" class="nav-link">Contact Us</a>
            <button id="theme-toggle-btn" class="btn theme-toggle-btn">Light Mode</button>
            <button id="history-btn" class="btn history-btn">History</button>
        </nav>
    </header>

    <main class="game-container">
        <section class="game-info">
            <div class="info-card">
                <span class="info-label">Attempts Left: </span>
                <span id="attempts-counter" class="info-value">8</span>
            </div>
            <div class="info-card">
                <span class="info-label">Time:</span>
                <span id="timer-display" class="info-value">00:00</span>
            </div>
            <button id="in-game-restart-btn" class="btn btn-secondary">Restart Match</button>
        </section>

        <section id="extra-clues-section" class="extra-clues-section hidden">
            <img id="secret-player-photo" class="secret-photo blur-8 hidden" src="" alt="Secret Player" referrerpolicy="no-referrer"><img id="secret-player-photo" class="secret-photo blur-8 hidden" src="" alt="Secret Player">
            <div id="medium-clues-container" class="medium-clues hidden"></div>
        </section>

        <section class="search-section">
            <div class="search-container">
                <input
                    type="text"
                    id="player-search-input"
                    class="search-input"
                    placeholder="Type a player name..."
                    autocomplete="off"
                >
                <ul id="autocomplete-list" class="autocomplete-list hidden"></ul>
            </div>
        </section>

        <section class="board-section">
            <div class="board-header">
                <span class="column-header">Player</span>
                <span class="column-header">Nationality</span>
                <span class="column-header">Club</span>
                <span class="column-header">Position</span>
                <span class="column-header">Age</span>
                <span class="column-header">Overall</span>
                <span class="column-header">Height</span>
            </div>
            <div id="attempts-board" class="board-grid">
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p class="footer-text">Futbolle &copy; Walter Toledo - 2026 - UAI</p>
    </footer>

    <div id="modal-container" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 id="modal-title" class="modal-title"></h2>
            <p id="modal-message" class="modal-message"></p>
            <select id="difficulty-select" class="search-input modal-input">
                <option value="easy">Easy (Photo Clue)</option>
                <option value="medium">Medium (Progressive Clues)</option>
                <option value="hard">Hard (No Clues, Hidden Club)</option>
            </select>
            <input type="text" id="human-name-input" class="search-input modal-input hidden" placeholder="Enter your name..." autocomplete="off">
            <p id="modal-error" class="modal-error"></p>
            <div id="modal-actions" class="modal-actions">
                <button id="modal-close-btn" class="btn btn-primary">Close</button>
                <button id="restart-game-btn" class="btn btn-secondary hidden">Play Again</button>
                <button id="start-game-btn" class="btn btn-primary hidden">Start Game</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay hidden">
        <div class="modal-content history-content">
            <h2 class="modal-title">Match History</h2>
            <div class="history-controls">
                <button id="sort-date-btn" class="btn btn-secondary">Sort by Date</button>
                <button id="sort-attempts-btn" class="btn btn-secondary">Sort by Attempts</button>
            </div>
            <div class="history-table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Result</th>
                            <th>Attempts</th>
                            <th>Duration</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody"></tbody>
                </table>
            </div>
            <div class="modal-actions">
                <button id="close-history-btn" class="btn btn-primary">Close</button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
